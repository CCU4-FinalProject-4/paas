name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - run: pip install -r api/requirements-dev.txt

      - name: ruff
        run: |
          ruff check api tests
          ruff format --check api tests

      - name: hadolint api
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: api/Dockerfile

      - name: hadolint web
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: web/Dockerfile

      - name: pytest
        working-directory: api
        run: pytest -q

  build-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ccu4-finalproject-4/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Floci runs inside the job: start from the previous release, then roll to the new one.
  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: start floci
        run: make infra

      - name: deploy previous release
        run: |
          NEW_TAG=sha-${GITHUB_SHA::7}
          prev=sha-${BEFORE::7}
          if docker manifest inspect "ghcr.io/ccu4-finalproject-4/api:$prev" >/dev/null 2>&1 &&
             docker manifest inspect "ghcr.io/ccu4-finalproject-4/web:$prev" >/dev/null 2>&1; then
            make deploy TAG="$prev"
          else
            echo "no images for $prev, starting from $NEW_TAG"
            make deploy TAG="$NEW_TAG"
          fi
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "PREV_TAG=$prev" >> "$GITHUB_ENV"

      # web is the single nginx in front of the replicas, so its swap is measured on its own.
      - name: rolling update
        run: |
          probe() {
            ./scripts/probe.sh "$1.csv" &
            pid=$!
            sleep 2
            SERVICES=$2 make deploy TAG="$NEW_TAG"
            kill "$pid"
            tail -n +2 "$1.csv" | awk -F, -v p="$1" \
              '{t++; if ($2 != "200") f++} END {printf "%s_requests=%d\n%s_failed=%d\n", p, t, p, f}' >> "$GITHUB_ENV"
          }
          probe api "api-1 api-2"
          probe web web

      - name: e2e tests
        run: make e2e

      - name: summary
        if: always()
        run: |
          {
            echo "### deploy on Floci"
            echo "rolled \`${PREV_TAG:-?}\` → \`${NEW_TAG:-?}\` (api-1, api-2, web one at a time)"
            echo ""
            echo "probe every 100 ms through nginx:"
            echo "- api replicas rolling update: **${api_requests:-0} requests, ${api_failed:-?} failed**"
            echo "- web (load balancer) swap: **${web_requests:-0} requests, ${web_failed:-?} failed**"
            echo ""
            echo '```'
            docker compose ps --format '{{.Name}}\t{{.Image}}\t{{.Status}}'
            set -a; . ./.env.floci; set +a
            aws ssm get-parameters-by-path --path /paas --recursive \
              --query 'Parameters[].[Name,Value]' --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rolling-update-probe
          path: "*.csv"
          if-no-files-found: ignore
