name: paas

services:
  # Local AWS emulator
  floci:
    image: floci/floci:2.5.0
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_DOCKER_NETWORK: paas
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    networks:
      - paas

  api:
    image: ghcr.io/ccu4-finalproject-4/api:${API_TAG:-latest}
    build: ./api
    ports:
      - "8000:8000"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      ITEMS_TABLE: ${ITEMS_TABLE:-paas-items}
      SESSIONS_TABLE: ${SESSIONS_TABLE:-paas-sessions}
      APP_VERSION: ${API_TAG:-dev}
    stop_grace_period: 30s
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - paas

volumes:
  floci-data:

networks:
  paas:
    name: paas
